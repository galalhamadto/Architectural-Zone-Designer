<style>

2px solid #2563eb;border-radius:6px;background:#fff;box-shadow:0 6px 18px rgba(15,23,42,.2);text-align:center;font:600 13px Segoe UI,Arial,sans-serif;transform:translate(-50%,-50%)}.muted{color:#64748b}.contextMenu{position:fixed;z-index:9999;min-width:180px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:6px}.contextMenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:5px;cursor:pointer}.contextMenu button:hover{background:#f1f5f9}.contextMenu button:disabled{opacity:.45;cursor:not-allowed;background:transparent}.contextMenu .sep{height:1px;background:#e2e8f0;margin:5px 0}@media(max-width:900px){.workspace{grid-template-columns:210px 1fr}.right{display:none}.setup{width:calc(100% - 16px);margin:8px}.setupGrid{grid-template-columns:1fr;min-width:0}.formPanel{border-right:0;border-bottom:1px solid #e2e8f0}.top{overflow-x:auto}.toolbar{overflow-x:auto}}

<script>
(function(){'use strict';
const SCALE=50;let state={mode:'start',rooms:[],selected:null,selectedIds:[],selectedBoundary:null,selectedShapes:[],snapMarker:null,chainCloseHint:null,clipboardRooms:[],contextPoint:null,stories:[{id:'story-1',name:'Ground Floor',elevation:0}],activeStoryId:'story-1',showLowerStory:true,snapToUnderlay:true,lowerStorySingleColor:false,lowerStoryColor:'#94a3b8',lowerStoryOpacity:.18,autoCloseChain:true,snapPriority:'geometry',showOrigin:true,showAxes:true,tool:'select',grid:true,snap:true,gridM:.5,zoom:1,pan:{x:50,y:50},style:{color:'#111827',weight:2,pattern:'solid'},history:[],future:[],project:{maxArea:0},print:{showArea:true,paper:'A3',orientation:'landscape',mode:'fit',scale:100,originX:0,originY:0,marginMm:10},guides:[],freeShapes:[],leftW:240,rightW:285,leftOpen:true,rightOpen:true};
const CUSTOM_PRESETS_KEY='azd_custom_room_presets_v1';
function getCustomPresets(){try{return JSON.parse(localStorage.getItem(CUSTOM_PRESETS_KEY)||'{}')}catch(e){return {}}}
function setCustomPresets(v){localStorage.setItem(CUSTOM_PRESETS_KEY,JSON.stringify(v))}
function presetOptions(){return Object.keys(getCustomPresets()).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="custom:${esc(n)}">${esc(n)} (custom)</option>`).join('')}
function saveRoomsAsPreset(){if(!state.rooms.length)return alert('Add at least one room before saving a preset.');const name=(prompt('Preset name:')||'').trim();if(!name)return;const all=getCustomPresets();if(all[name]&&!confirm(`Replace the existing preset “${name}”?`))return;all[name]=state.rooms.map(r=>({name:r.name,number:r.number,width:r.width,length:r.length,color:r.color,floor:r.floor,parentUnit:r.parentUnit,wetArea:!!r.wetArea,isRegular:r.isRegular!==false,boundaryOpacity:r.boundaryOpacity??1,boundaryPrintable:r.boundaryPrintable!==false,vertices:r.isRegular===false&&r.vertices?r.vertices.map(v=>({x:v.x-r.x,y:v.y-r.y})):null}));setCustomPresets(all);alert(`Preset “${name}” saved with ${state.rooms.length} rooms.`);render()}
function deleteCustomPreset(key){if(!key.startsWith('custom:'))return alert('Built-in presets cannot be deleted.');const name=key.slice(7),all=getCustomPresets();if(!all[name])return;if(!confirm(`Delete preset “${name}”?`))return;delete all[name];setCustomPresets(all);render()}
function normalizePresetRoom(x,index){
  if(!x||typeof x!=='object')throw new Error('Room '+(index+1)+' is not a valid object.');
  const name=String(x.name||'').trim(),width=Number(x.width),length=Number(x.length);
  if(!name)throw new Error('Room '+(index+1)+' has no name.');
  if(!(width>0)||!(length>0))throw new Error('Room “'+name+'” must have positive width and length.');
  return {name,number:String(x.number||'').trim(),width,length,color:/^#[0-9a-f]{6}$/i.test(String(x.color||''))?x.color:(x.wetArea?'#bfdbfe':'#dcfce7'),floor:String(x.floor||activeStory()?.name||'Ground Floor'),parentUnit:String(x.parentUnit||'Imported Preset'),wetArea:!!x.wetArea,isRegular:x.isRegular!==false,boundaryOpacity:Number.isFinite(+x.boundaryOpacity)?Math.max(.1,Math.min(1,+x.boundaryOpacity)):1,boundaryPrintable:x.boundaryPrintable!==false,vertices:Array.isArray(x.vertices)?x.vertices.map(v=>({x:+v.x||0,y:+v.y||0})):null,notes:String(x.notes||'')};
}
function parsePresetConfig(data){
  let presets=[];
  if(Array.isArray(data))presets=[{name:'Imported Rooms',rooms:data}];
  else if(Array.isArray(data?.presets))presets=data.presets;
  else if(Array.isArray(data?.rooms))presets=[data];
  else throw new Error('The file must contain a “presets” array or a “rooms” array.');
  return presets.map((p,i)=>{const name=String(p.name||p.id||('Imported Preset '+(i+1))).trim();if(!Array.isArray(p.rooms)||!p.rooms.length)throw new Error('Preset “'+name+'” contains no rooms.');return{name,description:String(p.description||''),rooms:p.rooms.map(normalizePresetRoom)}});
}
function insertConfiguredRooms(items,presetName){
  const story=activeStory(),startCount=state.rooms.length;
  commit(rs=>{const out=[...rs];items.forEach((x,i)=>{const idx=startCount+i,px=(idx%4)*6,py=Math.floor(idx/4)*5;let number=x.number||'R-'+String(idx+1).padStart(2,'0');if(out.some(r=>r.number===number))number=nextRoomNumber(number);const room={...x,id:uid(),storyId:state.activeStoryId,number,x:px,y:py,shapes:[],tagOffsetX:0,tagOffsetY:0};if(room.isRegular===false&&Array.isArray(room.vertices)&&room.vertices.length>=3)room.vertices=room.vertices.map(v=>({x:px+v.x,y:py+v.y}));else{room.isRegular=true;delete room.vertices}out.push(room)});return out});
  alert('Inserted '+items.length+' rooms from “'+presetName+'” into '+(story?.name||'the active story')+'.');
}
function importPresetConfig(e){
  const input=e.target,file=input.files&&input.files[0];if(!file)return;
  const rd=new FileReader();rd.onload=()=>{try{const parsed=parsePresetConfig(JSON.parse(rd.result));const all=getCustomPresets();parsed.forEach(p=>all[p.name]=p.rooms);setCustomPresets(all);let chosen=parsed[0];if(parsed.length>1){const menu=parsed.map((p,i)=>(i+1)+'. '+p.name+' ('+p.rooms.length+' rooms)').join('\n');const answer=prompt('The file contains multiple presets. Enter the number to insert:\n\n'+menu,'1');if(answer===null){alert('Preset library imported. No rooms were inserted.');render();return}const n=parseInt(answer,10);if(!(n>=1&&n<=parsed.length))throw new Error('Invalid preset selection.');chosen=parsed[n-1]}insertConfiguredRooms(chosen.rooms,chosen.name)}catch(err){alert('Could not import preset configuration:\n'+err.message)}finally{input.value=''}};rd.onerror=()=>{alert('Could not read the selected file.');input.value=''};rd.readAsText(file);
}
let canvas,ctx,action=null,cursor={x:0,y:0},snapGuides=[],snapClearTimer=null; const $=s=>document.querySelector(s); const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,7); const snap=(v)=>state.snap?Math.round(v/state.gridM)*state.gridM:v; function polygonArea(v){if(!v||v.length<3)return 0;let a=0;for(let i=0;i<v.length;i++){const j=(i+1)%v.length;a+=v[i].x*v[j].y-v[j].x*v[i].y}return Math.abs(a)/2} const area=r=>(r&&r.isRegular===false&&Array.isArray(r.vertices)&&r.vertices.length>=3)?polygonArea(r.vertices):(+r.width||0)*(+r.length||0);
const blank=()=>({name:'Living Room',number:'R-'+String(state.rooms.length+1).padStart(2,'0'),width:5,length:4,color:'#dbeafe',floor:'Ground Floor',parentUnit:'Apartment A',wetArea:false,isRegular:true,boundaryOpacity:1,boundaryPrintable:true}); let draft=blank();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persistRecovery(){try{localStorage.setItem('azd_recovery_v35',JSON.stringify({savedAt:new Date().toISOString(),rooms:state.rooms,project:state.project,guides:state.guides,freeShapes:state.freeShapes,stories:state.stories,activeStoryId:state.activeStoryId}))}catch(e){}}
function commit(fn){state.history.push(JSON.parse(JSON.stringify(state.rooms)));if(state.history.length>200)state.history.shift();state.future=[];state.rooms=fn(state.rooms);persistRecovery();render()}
function download(content,name,type){const b=new Blob([content],{type:type||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function clearSnapVisuals(delay=450){
  if(snapClearTimer)clearTimeout(snapClearTimer);
  snapClearTimer=setTimeout(()=>{
    state.snapMarker=null;state.chainCloseHint=null;
    snapGuides=[];
    if(canvas&&ctx)draw();
  },delay);
}
function keepSnapVisuals(){
  if(snapClearTimer){clearTimeout(snapClearTimer);snapClearTimer=null}
}

function formHtml(o,prefix){return `<div class="row"><div class="field"><label>Room name</label><input id="${prefix}name" value="${esc(o.name)}"></div><div class="field"><label>Room number</label><input id="${prefix}number" value="${esc(o.number)}"></div></div><div class="row"><div class="field"><label>Width (m)</label><input id="${prefix}width" type="number" min="0.1" step="0.1" value="${o.width}"></div><div class="field"><label>Length (m)</label><input id="${prefix}length" type="number" min="0.1" step="0.1" value="${o.length}"></div></div><div class="field"><label>Parent unit / section</label><input id="${prefix}parentUnit" value="${esc(o.parentUnit)}"></div><div class="row"><div class="field"><label>Floor / Story</label>${prefix==='s_'?`<select id="${prefix}storyId">${state.stories.map(s=>`<option value="${s.id}" ${(o.storyId||'story-1')===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:`<input id="${prefix}floor" value="${esc(o.floor)}">`}</div><div class="field"><label>Color</label><input id="${prefix}color" type="color" value="${o.color}"></div></div><label class="check"><input id="${prefix}wetArea" type="checkbox" ${o.wetArea?'checked':''}> Wet area</label><label class="check"><input id="${prefix}isRegular" type="checkbox" ${o.isRegular?'checked':''}> Regular rectangle</label>${o.isRegular===false?'<div class="hint">Irregular room: drag blue vertex grips to reshape it. Use Add Vertex or Remove Vertex to change the number of corners. Draw a closed loop with Line/Chain Line, then use Lines → Room to replace the complete boundary.</div>':''}<div class="notice">Calculated area: ${area(o).toFixed(2)} m²</div>`}
function readForm(prefix){return {name:$('#'+prefix+'name').value.trim(),number:$('#'+prefix+'number').value.trim(),width:+$('#'+prefix+'width').value,length:+$('#'+prefix+'length').value,parentUnit:$('#'+prefix+'parentUnit').value.trim(),floor:$('#'+prefix+'floor')?$('#'+prefix+'floor').value.trim():(activeStory()?.name||''),storyId:$('#'+prefix+'storyId')?$('#'+prefix+'storyId').value:undefined,color:$('#'+prefix+'color').value,wetArea:$('#'+prefix+'wetArea').checked,isRegular:$('#'+prefix+'isRegular').checked}}
function captureScroll(){const out={windowX:window.scrollX,windowY:window.scrollY,elements:{}};document.querySelectorAll('[data-scroll-key]').forEach(el=>out.elements[el.dataset.scrollKey]={top:el.scrollTop,left:el.scrollLeft});return out}function restoreScroll(out){if(!out)return;requestAnimationFrame(()=>{window.scrollTo(out.windowX||0,out.windowY||0);document.querySelectorAll('[data-scroll-key]').forEach(el=>{const v=out.elements[el.dataset.scrollKey];if(v){el.scrollTop=v.top;el.scrollLeft=v.left}})})}function render(){const scroll=captureScroll();state.mode==='start'?renderStart():state.mode==='setup'?renderSetup():renderDesign();restoreScroll(scroll)}

function resetProject(){
  state.rooms=[];state.guides=[];state.freeShapes=[];state.history=[];state.future=[];
  state.selected=null;state.selectedIds=[];state.stories=[{id:'story-1',name:'Ground Floor',elevation:0}];
  state.activeStoryId='story-1';state.project={maxArea:0};
  state.print={showArea:true,paper:'A3',orientation:'landscape',mode:'fit',scale:100,originX:0,originY:0,marginMm:10};
  draft=blank();
}
function renderStart(){
  document.getElementById('app').innerHTML=`<div class="startScreen"><div class="startCard">
  <h1>Architectural Zone Designer</h1><p class="muted">Start a new zoning project or open a saved project.</p>
  <label class="check" style="margin-top:18px"><input id="startBlank" type="checkbox" checked> Start with a blank canvas</label>
  <div class="small">Uncheck to open the Room Setup form before entering the canvas.</div>
  <div class="startActions"><button id="newProject" class="btn primary">New Project</button><label class="btn">Open Project<input id="startOpen" hidden type="file" accept=".json"></label></div>
  </div></div>`;
  $('#newProject').onclick=()=>{resetProject();state.mode=$('#startBlank').checked?'design':'setup';render()};
  $('#startOpen').onchange=openJSON;
}

function renderSetup(){document.getElementById('app').innerHTML=`<div class="app"><div class="top"><div class="brand">Architectural Zone Designer</div><span class="muted">Room setup</span><div class="spacer"></div><button id="start" class="btn primary">Start Designing</button></div><div class="setup" data-scroll-key="setup-main"><div class="setupHead"><h2 style="margin:0 0 5px">Create the room schedule</h2><div class="muted">Add rooms and dimensions, then arrange them on the canvas.</div><div class="row" style="margin-top:12px"><div class="field"><label>Stories</label><select id="setupStorySelect">${state.stories.map(s=>`<option value="${s.id}" ${s.id===state.activeStoryId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Story actions</label><div style="display:flex;gap:6px;flex-wrap:wrap"><button id="setupAddStory" class="btn">+ Story</button><button id="setupRenameStory" class="btn">Rename</button><button id="setupDeleteStory" class="btn danger">Delete</button></div></div></div><div class="row" style="margin-top:12px"><div class="field"><label>Maximum project area (m², 0 = unlimited)</label><input id="maxArea" type="number" min="0" step="1" value="${state.project.maxArea||0}"></div><div class="field"><label>Residential room preset</label><select id="preset"><option value="">Choose preset...</option><option value="studio">Studio apartment</option><option value="onebed">1-bedroom apartment</option><option value="twobed">2-bedroom apartment</option><option value="villa">Typical villa ground floor</option>${presetOptions()}</select></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="addPreset" class="btn">Add Preset Rooms</button><label class="btn primary">Import Preset Config<input id="importPresetConfig" hidden type="file" accept=".json,application/json"></label><button id="savePreset" class="btn">Save Current Rooms as Preset</button><button id="deletePreset" class="btn danger">Delete Selected Custom Preset</button></div><div class="${state.project.maxArea&&state.rooms.reduce((a,r)=>a+area(r),0)>state.project.maxArea?'warning':'ok'}">Total scheduled area: ${state.rooms.reduce((a,r)=>a+area(r),0).toFixed(2)} m²${state.project.maxArea?' / Max '+state.project.maxArea+' m²':''}</div></div><div class="setupGrid"><div class="panel formPanel">${formHtml(draft,'d_')}<button id="add" class="btn primary" style="width:100%">Add Room</button></div><div class="panel" data-scroll-key="setup-table" style="overflow:auto;max-height:calc(100vh - 285px);scrollbar-gutter:stable"><table class="table"><thead><tr><th>No.</th><th>Room</th><th>Dimensions</th><th>Area</th><th>Unit / Floor</th><th>Story</th><th></th></tr></thead><tbody>${state.rooms.map(r=>`<tr draggable="true" class="setupRoomRow" data-id="${r.id}"><td>${esc(r.number)}</td><td><span class="swatch" style="background:${r.color}"></span>${esc(r.name)}</td><td>${r.width} × ${r.length} m</td><td>${area(r).toFixed(2)} m²</td><td>${esc(r.parentUnit)}<div class="small">${esc(r.floor)}</div></td><td><select class="roomStorySelect" data-id="${r.id}">${state.stories.map(s=>`<option value="${s.id}" ${(r.storyId||'story-1')===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td><td><button class="btn danger remove" data-id="${r.id}">Remove</button></td></tr>`).join('')}</tbody></table>${state.rooms.length?'':'<p class="muted">No rooms added yet.</p>'}<div class="section" style="padding:12px 0 0"><h3>Drag Rooms to Story</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${state.stories.map(s=>`<div class="storyDropZone" data-story="${s.id}" style="min-width:150px;padding:12px;border:2px dashed #94a3b8;border-radius:8px;background:#f8fafc"><strong>${esc(s.name)}</strong><div class="small">Drop to move<br>Shift-drop to duplicate</div></div>`).join('')}</div></div></div></div></div></div>`;
const addRoomButton=$('#add');if(addRoomButton)addRoomButton.addEventListener('click',e=>{e.preventDefault();const values=readForm('d_');if(!values.name||!Number.isFinite(values.width)||!Number.isFinite(values.length)||values.width<=0||values.length<=0)return alert('Enter a room name and positive dimensions.');const px=(state.rooms.length%4)*6,py=Math.floor(state.rooms.length/4)*5;const room={...values,id:uid(),storyId:state.activeStoryId,x:px,y:py,shapes:[],boundaryOpacity:1,boundaryPrintable:true};if(values.isRegular===false)room.vertices=[{x:px,y:py},{x:px+values.width,y:py},{x:px+values.width,y:py+values.length},{x:px,y:py+values.length}];state.rooms.push(room);draft=blank();warnArea();render()});$('#start').onclick=()=>{if(state.rooms.length)setSingleSelection(state.rooms[0].id);else setSingleSelection(null);state.mode='design';render()};document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{state.rooms=state.rooms.filter(r=>r.id!==b.dataset.id);render()});$('#setupStorySelect').onchange=e=>{state.activeStoryId=e.target.value;render()};
$('#setupAddStory').onclick=addStory;
$('#setupRenameStory').onclick=renameStory;
$('#setupDeleteStory').onclick=deleteStory;

function addStory(){
  const name=(prompt('Story name',`Story ${state.stories.length+1}`)||'').trim();
  if(!name)return;
  const id='story-'+Date.now();
  const prev=state.stories[state.stories.length-1];
  const elevation=+(prompt('Elevation (m)',String((prev?.elevation||0)+3))||((prev?.elevation||0)+3));
  state.stories.push({id,name,elevation:Number.isFinite(elevation)?elevation:0});
  state.activeStoryId=id;state.selected=null;state.selectedIds=[];render();
}
function renameStory(){
  const s=activeStory();if(!s)return;
  const name=(prompt('Story name',s.name)||'').trim();
  if(name){s.name=name;render()}
}
function deleteStory(){
  if(state.stories.length<=1)return alert('At least one story must remain.');
  const s=activeStory();
  if(roomsOnStory(s.id).length&&!confirm(`Delete ${s.name} and all rooms on it?`))return;
  state.rooms=state.rooms.filter(r=>(r.storyId||'story-1')!==s.id);
  const i=storyIndex(s.id);state.stories.splice(i,1);
  state.activeStoryId=state.stories[Math.max(0,i-1)].id;
  state.selected=null;state.selectedIds=[];render();
}

  state.selectedShapes=[];state.selectedBoundary=null;
  render();

function copySelectedRooms(){

  state.clipboardRooms=ids.map(id=>{
    const r=state.rooms.find(x=>x.id===id);
    return r?JSON.parse(JSON.stringify(r)):null;
  }).filter(Boolean);
  return state.clipboardRooms.length>0;
}
function pasteRooms(atPoint){
  if(!state.clipboardRooms||!state.clipboardRooms.length)return false;
  state.history.push(JSON.parse(JSON.stringify(state.rooms)));if(state.history.length>50)state.history.shift();state.future=[];
  const src=state.clipboardRooms.map(r=>JSON.parse(JSON.stringify(r)));
  const bounds=src.map(roomBounds);
  const minX=Math.min(...bounds.map(b=>b.left)),minY=Math.min(...bounds.map(b=>b.top));
  const offset=atPoint?{x:atPoint.x-minX,y:atPoint.y-minY}:{x:.5,y:.5};
  const newIds=[];

    const id=uid(),dx=offset.x,dy=offset.y;
    r.id=id;r.storyId=state.activeStoryId;r.name=nextCopyName(r.name);r.number=nextRoomNumber(r.number);
    r.x+=dx;r.y+=dy;
    if(r.isRegular===false&&Array.isArray(r.vertices))r.vertices=r.vertices.map(v=>({x:v.x+dx,y:v.y+dy}));
    state.rooms.push(r);newIds.push(id);
  });

  render();return true;
}
function pasteRoomsInPlace(){
  if(!state.clipboardRooms||!state.clipboardRooms.length)return false;
  state.history.push(JSON.parse(JSON.stringify(state.rooms)));if(state.history.length>50)state.history.shift();state.future=[];
  const newIds=[];
  state.clipboardRooms.map(r=>JSON.parse(JSON.stringify(r))).forEach(r=>{
    const id=uid();
    r.id=id;
    r.storyId=state.activeStoryId;
    r.name=nextCopyName(r.name);
    r.number=nextRoomNumber(r.number);
    state.rooms.push(r);
    newIds.push(id);
  });
  state.selectedIds=newIds;
  state.selected=newIds[newIds.length-1]||null;
  render();
  return true;
}

function duplicateSelectedRooms(){
  if(!copySelectedRooms())return false;
  return pasteRooms();
}
function deleteSelectedRooms(){
  const ids=new Set(selectedRoomIds());
  if(!ids.size)return false;
  state.history.push(JSON.parse(JSON.stringify(state.rooms)));if(state.history.length>50)state.history.shift();state.future=[];
  state.rooms=state.rooms.filter(r=>!ids.has(r.id));
  state.selected=null;state.selectedIds=[];
  render();return true;
}

  if(e.key==='Escape'){if(action&&action.kind==='commandMove'){action.ids.forEach(id=>{const i=state.rooms.findIndex(r=>r.id===id),o=action.origins[id];if(i>=0&&o)state.rooms[i]=JSON.parse(JSON.stringify(o))});state.tool='select'}action=null;toolPoints=[];state.snapMarker=null;state.chainCloseHint=null;snapGuides=[];if(snapClearTimer)clearTimeout(snapClearTimer);render()}
  if(e.key==='Enter'&&state.tool==='chain'){action=null;state.snapMarker=null;state.chainCloseHint=null;snapGuides=[];if(snapClearTimer)clearTimeout(snapClearTimer);draw()}
}
function nextRoomNumber(base){const m=String(base||'R-01').match(/^(.*?)(\d+)$/);if(!m)return base+'-COPY';let n=1;while(state.rooms.some(r=>r.number===m[1]+String(+m[2]+n).padStart(m[2].length,'0')))n++;return m[1]+String(+m[2]+n).padStart(m[2].length,'0')}function warnArea(){const total=state.rooms.reduce((a,r)=>a+area(r),0);if(state.project.maxArea&&total>state.project.maxArea)alert('Warning: total room area '+total.toFixed(2)+' m² exceeds the project maximum of '+state.project.maxArea.toFixed(2)+' m².')}
function undo(){if(!state.history.length)return;state.future.unshift(JSON.parse(JSON.stringify(state.rooms)));state.rooms=state.history.pop();persistRecovery();render()}function redo(){if(!state.future.length)return;state.history.push(JSON.parse(JSON.stringify(state.rooms)));state.rooms=state.future.shift();persistRecovery();render()}
function saveJSON(){download(JSON.stringify({version:11,rooms:state.rooms,project:state.project,guides:state.guides},null,2),'architectural-zoning.json','application/json')}function openJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);state.rooms=Array.isArray(x)?x:x.rooms||[];state.project=x.project||state.project;state.guides=x.guides||[];setSingleSelection(state.rooms[0]?.id||null);render()}catch(err){alert('Invalid project file')}};rd.readAsText(f)}
function exportCSV(){const rows=[['Room Number','Room Name','Width (m)','Length (m)','Area (m²)','Floor','Parent Unit','Wet Area']];state.rooms.forEach(r=>rows.push([r.number,r.name,r.width,r.length,area(r).toFixed(2),r.floor,r.parentUnit,r.wetArea?'Yes':'No']));download('\ufeff'+rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'room-schedule.csv','text/csv;charset=utf-8')}
function exportSVG(){let s='<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="-2 -2 32 20"><rect x="-2" y="-2" width="32" height="20" fill="white"/>';state.guides.filter(g=>g.printable!==false).forEach(g=>{s+=`<line x1="${g.a.x}" y1="${g.a.y}" x2="${g.b.x}" y2="${g.b.y}" stroke="${g.color}" stroke-width=".06" stroke-dasharray=".2 .12"/>`});state.rooms.forEach(r=>{const v=roomVertices(r),pts=v.map(p=>p.x+','+p.y).join(' '),cx=v.reduce((a,p)=>a+p.x,0)/v.length,cy=v.reduce((a,p)=>a+p.y,0)/v.length;s+=`${r.boundaryPrintable===false?'':`<polygon points="${pts}" fill="${r.color}" stroke="#334155" stroke-width=".04"/>`}<text x="${cx}" y="${cy}" text-anchor="middle" font-size=".32">${esc(r.name)}</text>`});s+='</svg>';download(s,'architectural-zoning.svg','image/svg+xml')}
function exportDXF(){let d='0\nSECTION\n2\nENTITIES\n';const clean=t=>String(t??'').replace(/[\r\n]/g,' ').replace(/[^\x20-\x7E]/g,' '),ln=(a,b,l)=>`0\nLINE\n8\n${l}\n10\n${a.x}\n20\n${-a.y}\n30\n0\n11\n${b.x}\n21\n${-b.y}\n31\n0\n`,tx=(p,text,height,layer)=>`0\nTEXT\n8\n${layer}\n10\n${p.x}\n20\n${-p.y}\n30\n0\n40\n${height}\n1\n${clean(text)}\n7\nSTANDARD\n72\n1\n73\n2\n11\n${p.x}\n21\n${-p.y}\n31\n0\n`;state.guides.forEach((g,i)=>d+=ln(g.a,g.b,(g.type+'_'+i).toUpperCase()));state.rooms.forEach(r=>{const l=('ROOM_'+r.number).replace(/[^A-Za-z0-9_-]/g,'_'),v=roomVertices(r);for(let i=0;i<v.length;i++)d+=ln(v[i],v[(i+1)%v.length],l);const c={x:v.reduce((s,p)=>s+p.x,0)/v.length,y:v.reduce((s,p)=>s+p.y,0)/v.length};d+=tx({x:c.x,y:c.y-.16},r.name||r.number,.28,'ROOM_NAMES');d+=tx({x:c.x,y:c.y+.16},area(r).toFixed(2)+' sqm',.22,'ROOM_AREAS')});d+='0\nENDSEC\n0\nEOF\n';download(d,'architectural-zoning.dxf','application/dxf')}
render();
})();

/* ---- AZD V10 Resize/Snap Patch ---- */
(function(){
  const oldMove = move;
  const oldSnap = snapRoomPosition;
  function edgeSnapResize(room, edge, value){
    const tol=Math.max(0.08,12/(SCALE*state.zoom));
    let best=value;
    state.rooms.forEach(o=>{
      if(o.id===room.id) return;
      const vals={
        left:o.x,right:o.x+o.width,
        top:o.y,bottom:o.y+o.length
      };
      if(edge==='left'||edge==='right'){
        [vals.left,vals.right].forEach(v=>{
          if(Math.abs(value-v)<=tol) best=v;
        });
      }else{
        [vals.top,vals.bottom].forEach(v=>{
          if(Math.abs(value-v)<=tol) best=v;
        });
      }
    });
    return best;
  }

  move=function(e){
    if(action && action.kind==='rectResize'){
      const room=state.rooms.find(r=>r.id===action.id);
      if(!room) return;
      let p=world(e);
      p={x:state.snap?snap(p.x):p.x,y:state.snap?snap(p.y):p.y};

      const o=action.origin;
      const left=o.x,right=o.x+o.width,top=o.y,bottom=o.y+o.length;

      const g=action.gripData;
      // side grips
      if(g.kind==='edge'){
        // top
        if(Math.abs(g.y-top)<1e-6){
          let ny=edgeSnapResize(room,'top',p.y);
          room.y=Math.min(ny,bottom-0.2);
          room.length=bottom-room.y;
        }
        // right
        else if(Math.abs(g.x-right)<1e-6){
          let nr=edgeSnapResize(room,'right',p.x);
          room.width=Math.max(0.2,nr-left);
        }
        // bottom
        else if(Math.abs(g.y-bottom)<1e-6){
          let nb=edgeSnapResize(room,'bottom',p.y);
          room.length=Math.max(0.2,nb-top);
        }
        // left
        else{
          let nl=edgeSnapResize(room,'left',p.x);
          room.x=Math.min(nl,right-0.2);
          room.width=right-room.x;
        }
      }
      // corner grips
      else{
        if(g.vertex===0){
          room.x=Math.min(p.x,right-0.2);
          room.y=Math.min(p.y,bottom-0.2);
          room.width=right-room.x;
          room.length=bottom-room.y;
        }else if(g.vertex===1){
          room.y=Math.min(p.y,bottom-0.2);
          room.width=Math.max(0.2,p.x-left);
          room.length=bottom-room.y;
        }else if(g.vertex===2){
          room.width=Math.max(0.2,p.x-left);
          room.length=Math.max(0.2,p.y-top);
        }else if(g.vertex===3){
          room.x=Math.min(p.x,right-0.2);
          room.width=right-room.x;
          room.length=Math.max(0.2,p.y-top);
        }
      }
      draw();
      return;
    }
    return oldMove(e);
  };
})();
