const CUSTOM_PRESETS_KEY='azd_custom_room_presets_v1';

function setCustomPresets(v){localStorage.setItem(CUSTOM_PRESETS_KEY,JSON.stringify(v))}
function presetOptions(){return Object.keys(getCustomPresets()).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="custom:${esc(n)}">${esc(n)} (custom)</option>`).join('')}
function saveRoomsAsPreset(){if(!state.rooms.length)return alert('Add at least one room before saving a preset.');const name=(prompt('Preset name:')||'').trim();if(!name)return;const all=getCustomPresets();if(all[name]&&!confirm(`Replace the existing preset “${name}”?`))return;all[name]=state.rooms.map(r=>({name:r.name,number:r.number,category:r.category||'Other',width:r.width,length:r.length,color:r.color,floor:r.floor,parentUnit:r.parentUnit,wetArea:!!r.wetArea,isRegular:r.isRegular!==false,boundaryOpacity:r.boundaryOpacity??1,boundaryPrintable:r.boundaryPrintable!==false,vertices:r.isRegular===false&&r.vertices?r.vertices.map(v=>({x:v.x-r.x,y:v.y-r.y})):null}));setCustomPresets(all);alert(`Preset “${name}” saved with ${state.rooms.length} rooms.`);render()}
function deleteCustomPreset(key){if(!key.startsWith('custom:'))return alert('Built-in presets cannot be deleted.');const name=key.slice(7),all=getCustomPresets();if(!all[name])return;if(!confirm(`Delete preset “${name}”?`))return;delete all[name];setCustomPresets(all);render()}

  const name=String(x.name||'').trim(),width=Number(x.width),length=Number(x.length);
  if(!name)throw new Error('Room '+(index+1)+' has no name.');
  if(!(width>0)||!(length>0))throw new Error('Room “'+name+'” must have positive width and length.');
  return {name,number:String(x.number||'').trim(),category:String(x.category||inferRoomCategory(name)),width,length,color:/^#[0-9a-f]{6}$/i.test(String(x.color||''))?x.color:(x.wetArea?'#bfdbfe':'#dcfce7'),floor:String(x.floor||activeStory()?.name||'Ground Floor'),parentUnit:String(x.parentUnit||'Imported Preset'),wetArea:!!x.wetArea,isRegular:x.isRegular!==false,boundaryOpacity:Number.isFinite(+x.boundaryOpacity)?Math.max(.1,Math.min(1,+x.boundaryOpacity)):1,boundaryPrintable:x.boundaryPrintable!==false,vertices:Array.isArray(x.vertices)?x.vertices.map(v=>({x:+v.x||0,y:+v.y||0})):null,notes:String(x.notes||'')};

function parsePresetConfig(data){
  let presets=[];
  if(Array.isArray(data))presets=[{name:'Imported Rooms',rooms:data}];
  else if(Array.isArray(data?.presets))presets=data.presets;
  else if(Array.isArray(data?.rooms))presets=[data];

  const story=activeStory(),startCount=state.rooms.length;
  commit(rs=>{const out=[...rs];items.forEach((x,i)=>{const idx=startCount+i,px=(idx%4)*6,py=Math.floor(idx/4)*5;let number=x.number||'R-'+String(idx+1).padStart(2,'0');if(out.some(r=>r.number===number))number=nextRoomNumber(number);const room={...x,id:uid(),storyId:state.activeStoryId,number,x:px,y:py,shapes:[],tagOffsetX:0,tagOffsetY:0};if(room.isRegular===false&&Array.isArray(room.vertices)&&room.vertices.length>=3)room.vertices=room.vertices.map(v=>({x:px+v.x,y:py+v.y}));else{room.isRegular=true;delete room.vertices}out.push(room)});return out});
